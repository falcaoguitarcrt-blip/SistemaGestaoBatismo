name: Validar sintaxe JavaScript

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/etapa-*"

jobs:
  inline-javascript:
    name: Verificar scripts inline
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar sintaxe dos scripts do index.html
        run: node scripts/check-inline-scripts.mjs
      - name: Verificar contratos de integração multi-turma
        run: node scripts/check-multiturma-contract.mjs
      - name: Verificar importação das duas abas da Turma 36
        run: node scripts/check-two-sheet-import-contract.mjs
      - name: Verificar contratos de preservação de dados
        run: node scripts/check-data-preservation-contract.mjs
      - name: Testar comportamento de check-in e desfazer com mocks
        run: node scripts/test-day-checkin-behavior.mjs
      - name: Testar concorrência de salvamento do workspace com mocks
        run: node scripts/test-workspace-concurrency.mjs
