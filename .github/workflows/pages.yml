name: Publicar Gestão de Batismo no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar Google Login da versão estável
        run: python scripts/restore-google-login.py

      - name: Validar scripts inline
        run: node scripts/check-inline-scripts.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
