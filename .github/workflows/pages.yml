name: Publicar Gestão de Batismo no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar autenticação Google da última versão estável
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          GOOD = '5c02803d0996a399055864b87a9bac4cf77cba8d'
          path = Path('index.html')
          current = path.read_text(encoding='utf-8')
          good = subprocess.check_output(['git', 'show', GOOD + ':index.html'], text=True)

          def import_line(text, filename):
              for line in text.splitlines():
                  if filename in line and line.lstrip().startswith('import '):
                      return line.strip()
              raise SystemExit('Import estável não encontrado: ' + filename)

          lines = current.splitlines()
          for filename in ('firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'):
              stable_line = import_line(good, filename)
              replaced = False
              for i, line in enumerate(lines):
                  if filename in line and line.lstrip().startswith('import '):
                      lines[i] = stable_line
                      replaced = True
                      break
              if not replaced:
                  raise SystemExit('Import atual não encontrado: ' + filename)
          current = '\n'.join(lines) + ('\n' if current.endswith('\n') else '')

          def replace_between(text, start_marker, end_marker, replacement):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit('Marcador inicial não encontrado: ' + start_marker)
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit('Marcador final não encontrado: ' + end_marker)
              return text[:start] + replacement + text[end:]

          stable_error_start = good.find('function explainAuthError(error) {')
          stable_error_end = good.find('\nfunction safeValue(value) {', stable_error_start)
          if stable_error_start < 0 or stable_error_end < 0:
              raise SystemExit('Função estável explainAuthError não encontrada.')
          current = replace_between(
              current,
              'function explainAuthError(error) {',
              '\nfunction safeValue(value) {',
              good[stable_error_start:stable_error_end]
          )

          # Remove um eventual bloco redirect já presente.
          redirect_marker = '// Processa um eventual retorno de signInWithRedirect uma única vez durante a inicialização.'
          redirect_start = current.find(redirect_marker)
          if redirect_start >= 0:
              redirect_end = current.find("\nloginForm.addEventListener('submit'", redirect_start)
              if redirect_end < 0:
                  raise SystemExit('Bloco redirect existente sem limite final.')
              # Mantém o login form e tudo que vem depois.
              current = current[:redirect_start] + current[redirect_end + 1:]

          # Encontra o handler Google mesmo se aspas/espaços mudarem.
          login_start = current.find("loginForm.addEventListener('submit'")
          if login_start < 0:
              login_start = current.find('loginForm.addEventListener("submit"')
          if login_start < 0:
              raise SystemExit('Handler do login por e-mail não encontrado.')

          google_matches = list(re.finditer(r"googleLoginButton\s*\.\s*addEventListener\s*\(\s*['\"]click['\"]", current[:login_start]))
          if not google_matches:
              raise SystemExit('Handler do botão Google não encontrado antes do login por e-mail.')
          google_match = google_matches[-1]
          google_start = google_match.start()

          # Localiza o início da função callback e faz balanceamento de chaves.
          brace = current.find('{', google_match.end())
          if brace < 0 or brace > login_start:
              raise SystemExit('Início do callback Google não encontrado.')
          depth = 0
          close_brace = -1
          for i in range(brace, login_start):
              if current[i] == '{':
                  depth += 1
              elif current[i] == '}':
                  depth -= 1
                  if depth == 0:
                      close_brace = i
                      break
          if close_brace < 0:
              raise SystemExit('Fim do callback Google não encontrado.')
          close_end = current.find(');', close_brace, login_start)
          if close_end < 0:
              raise SystemExit('Fechamento do handler Google não encontrado.')
          current_google_end = close_end + 2

          stable_google_start = good.find("googleLoginButton.addEventListener('click'")
          stable_login_start = good.find("\nloginForm.addEventListener('submit'", stable_google_start)
          stable_redirect_start = good.find(redirect_marker)
          if stable_google_start < 0 or stable_login_start < 0 or stable_redirect_start < 0:
              raise SystemExit('Fluxo Google estável incompleto.')
          stable_google_block = good[stable_google_start:stable_login_start]
          stable_redirect_block = good[stable_redirect_start:stable_google_start]

          current = current[:google_start] + stable_redirect_block + stable_google_block + current[current_google_end:]

          required = [
              'firebasejs/12.19.0/firebase-app.js',
              'firebasejs/12.19.0/firebase-auth.js',
              'firebasejs/12.19.0/firebase-firestore.js',
              'getRedirectResult',
              'signInWithRedirect',
              "googleLoginButton.addEventListener('click'"
          ]
          missing = [item for item in required if item not in current]
          if missing:
              raise SystemExit('Correção Google incompleta. Itens ausentes: ' + ', '.join(missing))

          path.write_text(current, encoding='utf-8')
          print('Autenticação Google restaurada a partir de ' + GOOD)

      - name: Validar JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script type="module">(.*?)</script>', text, re.S)
          if not blocks:
              raise SystemExit('Nenhum bloco module encontrado')
          for n, block in enumerate(blocks):
              Path(f'/tmp/firebase-module-{n}.js').write_text(block, encoding='utf-8')
          PY
          for file in /tmp/firebase-module-*.js; do node --check "$file"; done

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
