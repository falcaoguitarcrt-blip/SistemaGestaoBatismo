name: Publicar Gestão de Batismo no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar Google Login da versão estável
        run: python scripts/restore-google-login.py

      - name: Validar JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          marker = '<script type="module">'
          start = text.find(marker)
          end = text.find('</script>', start + len(marker)) if start >= 0 else -1
          if start < 0 or end < 0:
              raise SystemExit('Bloco Firebase module não encontrado')
          Path('/tmp/firebase-module.js').write_text(text[start + len(marker):end], encoding='utf-8')
          print('Bloco Firebase module encontrado e extraído para validação.')
          PY
          node --check /tmp/firebase-module.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
