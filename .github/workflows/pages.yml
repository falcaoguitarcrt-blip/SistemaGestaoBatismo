name: Publicar Gestão de Batismo no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar autenticação Google da última versão estável
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          GOOD = '5c02803d0996a399055864b87a9bac4cf77cba8d'
          path = Path('index.html')
          current = path.read_text(encoding='utf-8')
          good = subprocess.check_output(['git', 'show', GOOD + ':index.html'], text=True)

          def import_line(text, filename):
              for line in text.splitlines():
                  if filename in line and line.lstrip().startswith('import '):
                      return line.strip()
              raise SystemExit('Import estável não encontrado: ' + filename)

          # A V8 preserva a aplicação e seus dados. Restauramos apenas os três
          # imports Firebase para a versão que estava funcionando antes da V8.
          for filename in ('firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'):
              stable_line = import_line(good, filename)
              lines = current.splitlines()
              replaced = False
              for i, line in enumerate(lines):
                  if filename in line and line.lstrip().startswith('import '):
                      lines[i] = stable_line
                      replaced = True
                      break
              if not replaced:
                  raise SystemExit('Import atual não encontrado: ' + filename)
              current = '\n'.join(lines) + ('\n' if current.endswith('\n') else '')

          # Restaura a explicação de erros de autenticação estável, incluindo
          # domínio não autorizado, conta existente e fallback de popup.
          def replace_between(text, start_marker, end_marker, replacement):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit('Marcador inicial não encontrado: ' + start_marker)
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit('Marcador final não encontrado: ' + end_marker)
              return text[:start] + replacement + text[end:]

          stable_error_start = good.find('function explainAuthError(error) {')
          stable_error_end = good.find('\nfunction safeValue(value) {', stable_error_start)
          if stable_error_start < 0 or stable_error_end < 0:
              raise SystemExit('Função estável explainAuthError não encontrada.')
          stable_error_fn = good[stable_error_start:stable_error_end]
          current = replace_between(current, 'function explainAuthError(error) {', '\nfunction safeValue(value) {', stable_error_fn)

          # Evita duplicação se o arquivo já tiver recebido parte da correção.
          redirect_start_marker = '// Processa um eventual retorno de signInWithRedirect uma única vez durante a inicialização.'
          redirect_start = current.find(redirect_start_marker)
          if redirect_start >= 0:
              redirect_end = current.find("\ngoogleLoginButton.addEventListener('click'", redirect_start)
              if redirect_end < 0:
                  raise SystemExit('Bloco redirect existente sem fim identificável.')
              current = current[:redirect_start] + current[redirect_end + 1:]

          stable_redirect_start = good.find(redirect_start_marker)
          stable_google_start = good.find("googleLoginButton.addEventListener('click'", stable_redirect_start)
          if stable_redirect_start < 0 or stable_google_start < 0:
              raise SystemExit('Bloco Google estável não encontrado.')
          stable_redirect_block = good[stable_redirect_start:stable_google_start]

          # Substitui somente o handler do botão Google, preservando todo o
          # restante da V8, inclusive drag-and-drop, camisetas e Firestore.
          current_google_start = current.find("googleLoginButton.addEventListener('click'")
          current_login_start = current.find("\nloginForm.addEventListener('submit'", current_google_start)
          stable_login_start = good.find("\nloginForm.addEventListener('submit'", stable_google_start)
          if current_google_start < 0 or current_login_start < 0 or stable_login_start < 0:
              raise SystemExit('Limites do fluxo Google não encontrados.')
          stable_google_block = good[stable_google_start:stable_login_start]
          current = current[:current_google_start] + stable_redirect_block + stable_google_block + current[current_login_start + 1:]

          # Guardas finais: não publica se a correção não estiver realmente no artefato.
          required = [
              "firebasejs/12.19.0/firebase-app.js",
              "firebasejs/12.19.0/firebase-auth.js",
              "firebasejs/12.19.0/firebase-firestore.js",
              'getRedirectResult',
              'signInWithRedirect',
              "googleLoginButton.addEventListener('click'"
          ]
          missing = [item for item in required if item not in current]
          if missing:
              raise SystemExit('Correção Google incompleta. Itens ausentes: ' + ', '.join(missing))

          path.write_text(current, encoding='utf-8')
          print('Autenticação Google restaurada a partir de ' + GOOD)

      - name: Validar JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script type="module">(.*?)</script>', text, re.S)
          if not blocks:
              raise SystemExit('Nenhum bloco module encontrado')
          for n, block in enumerate(blocks):
              Path(f'/tmp/firebase-module-{n}.js').write_text(block, encoding='utf-8')
          PY
          for file in /tmp/firebase-module-*.js; do node --check "$file"; done

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
