name: Publicar Gestão de Batismo no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # A restauração automática do módulo Firebase (restore-google-login.py) foi
      # desativada: ela sobrescrevia o login somente Google a cada publicação.
      # O módulo agora é protegido pelo hash aprovado em apply-batizantes-v1.yml.
      - name: Validar scripts e contratos antes de publicar
        run: |
          node scripts/check-inline-scripts.mjs
          node scripts/check-multiturma-contract.mjs
          node scripts/check-two-sheet-import-contract.mjs
          node scripts/check-data-preservation-contract.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
