name: patch editor labels

on:
  push:
    branches:
      - fix/editor-cadastro-camiseta-labels-2026-10-15
    paths:
      - index.html
      - .github/workflows/patch-editor-labels.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Ajustar editor de cadastro
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_css = '.record-editor-field input,.record-editor-field textarea{display:block;width:100%;margin-top:5px;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-weight:400}'
          new_css = '.record-editor-field input,.record-editor-field textarea,.record-editor-field select{display:block;width:100%;margin-top:5px;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-weight:400;min-height:44px}\n.record-editor-field select{appearance:auto;cursor:pointer}\n.record-editor-field input:focus,.record-editor-field textarea:focus,.record-editor-field select:focus{outline:3px solid color-mix(in srgb,var(--pri) 24%,transparent);outline-offset:1px;border-color:var(--pri)}'
          if old_css in s:
              s = s.replace(old_css, new_css, 1)
          old_js = '''    recordEditorFields.innerHTML = labels.map(function (label, index) {\n      var value = fields[index] === null || fields[index] === undefined ? '' : String(fields[index]);\n      var wide = [5, 6, 11, 13].indexOf(index) >= 0;\n      var content = (kind === 'person' && [11, 13].indexOf(index) >= 0)\n        ? '<textarea data-editor-index="' + index + '" aria-label="' + esc(label) + '">' + esc(value) + '</textarea>'\n        : '<input type="text" data-editor-index="' + index + '" aria-label="' + esc(label) + '" value="' + esc(value) + '"' + (isNew && kind === 'person' && index === 0 ? ' required' : (isNew && kind === 'order' && index === 1 ? ' required' : '')) + '>';\n      return '<label class="record-editor-field' + (wide ? ' wide' : '') + '">' + esc(label) + content + '</label>';\n    }).join('');'''
          new_js = '''    recordEditorFields.innerHTML = labels.map(function (label, index) {\n      var value = fields[index] === null || fields[index] === undefined ? '' : String(fields[index]);\n      var wide = [5, 6, 11, 13].indexOf(index) >= 0;\n      var content;\n      if (kind === 'person' && index === 7) {\n        content = '<select data-editor-index="7" aria-label="Entrou no grupo?">' +\n          '<option value=""' + (value === '' ? ' selected' : '') + '>Não informado</option>' +\n          '<option value="true"' + (value.toLowerCase() === 'true' ? ' selected' : '') + '>Sim</option>' +\n          '<option value="false"' + (value.toLowerCase() === 'false' ? ' selected' : '') + '>Não</option>' +\n          '</select>';\n        label = 'Entrou no grupo?';\n      } else if (kind === 'person' && index === 8) {\n        content = '<input type="text" data-editor-index="8" aria-label="Tamanho da camiseta" value="' + esc(value) + '" placeholder="Ex.: P, M, G, GG, G3">';\n        label = 'Tamanho da camiseta';\n      } else if (kind === 'person' && index === 9) {\n        var paymentValue = value.toLowerCase();\n        content = '<select data-editor-index="9" aria-label="Pagamento camiseta">' +\n          '<option value=""' + (value === '' ? ' selected' : '') + '>Não informado</option>' +\n          '<option value="true"' + (paymentValue === 'true' ? ' selected' : '') + '>Pago</option>' +\n          '<option value="false"' + (paymentValue === 'false' ? ' selected' : '') + '>Não pago</option>' +\n          '</select>';\n        label = 'Pagamento camiseta';\n      } else {\n        content = (kind === 'person' && [11, 13].indexOf(index) >= 0)\n          ? '<textarea data-editor-index="' + index + '" aria-label="' + esc(label) + '">' + esc(value) + '</textarea>'\n          : '<input type="text" data-editor-index="' + index + '" aria-label="' + esc(label) + '" value="' + esc(value) + '"' + (isNew && kind === 'person' && index === 0 ? ' required' : (isNew && kind === 'order' && index === 1 ? ' required' : '')) + '>';\n      }\n      return '<label class="record-editor-field' + (wide ? ' wide' : '') + '">' + esc(label) + content + '</label>';\n    }).join('');'''
          if old_js in s:
              s = s.replace(old_js, new_js, 1)
          marker = '<!-- editor-camiseta-labels-v1 -->'
          if marker not in s:
              s = s.replace('</head>', marker + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commitir alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: melhorar labels e valores do editor de camisetas"
          git push
