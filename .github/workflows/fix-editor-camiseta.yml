name: Corrigir editor de camisetas
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-editor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          labels_old = "labels = ['NOME', 'IDADE', 'TELEFONE', 'TURMA', 'DATA', 'JORNADA', 'AULA P/ REPOR', 'ENTROU NO GRUPO', 'CAMISETA', 'PG CAMISETA', 'STATUS', 'PENDENCIA', 'BATIZADO', 'INVESTIGAÇÃO PERFIL (FBI)'];"
          labels_new = "labels = ['NOME', 'IDADE', 'TELEFONE', 'TURMA', 'DATA', 'JORNADA', 'AULA P/ REPOR', 'ENTROU NO GRUPO?', 'TAMANHO DA CAMISETA', 'PAGAMENTO CAMISETA', 'STATUS', 'PENDÊNCIA', 'BATIZADO?', 'INVESTIGAÇÃO DE PERFIL (FBI)'];"
          if labels_old not in s:
              raise SystemExit('Lista de labels alvo não encontrada')
          s = s.replace(labels_old, labels_new, 1)

          css_old = '.record-editor-field input,.record-editor-field textarea{display:block;width:100%;margin-top:5px;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-weight:400}'
          css_new = '.record-editor-field input,.record-editor-field textarea,.record-editor-field select{display:block;width:100%;margin-top:5px;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-weight:400;min-height:46px}.record-editor-field select{cursor:pointer}.record-editor-field input:focus,.record-editor-field textarea:focus,.record-editor-field select:focus{outline:3px solid color-mix(in srgb,var(--pri) 22%,transparent);outline-offset:1px;border-color:var(--pri)}'
          if css_old not in s:
              raise SystemExit('CSS alvo não encontrado')
          s = s.replace(css_old, css_new, 1)

          old = '''      var content = (kind === 'person' && [11, 13].indexOf(index) >= 0)\n        ? '<textarea data-editor-index=\\"' + index + '\\" aria-label=\\"' + esc(label) + '\\">' + esc(value) + '</textarea>'\n        : '<input type=\\"text\\" data-editor-index=\\"' + index + '\\" aria-label=\\"' + esc(label) + '\\" value=\\"' + esc(value) + '\\"' + (isNew && kind === 'person' && index === 0 ? ' required' : (isNew && kind === 'order' && index === 1 ? ' required' : '')) + '>';'''
          new = '''      var normalizedEditorValue = normal(value);\n      var content;\n      if (kind === 'person' && index === 7 && ['true', 'false', ''].indexOf(normalizedEditorValue) >= 0) {\n        var groupValue = normalizedEditorValue === 'true' ? 'true' : (normalizedEditorValue === 'false' ? 'false' : '');\n        content = '<select data-editor-index=\\"' + index + '\\" aria-label=\\"' + esc(label) + '\\"><option value=\\"\\" ' + (groupValue === '' ? 'selected' : '') + '>Não informado</option><option value=\\"true\\" ' + (groupValue === 'true' ? 'selected' : '') + '>Sim</option><option value=\\"false\\" ' + (groupValue === 'false' ? 'selected' : '') + '>Não</option></select>';\n      } else if (kind === 'person' && index === 9 && ['true', 'false', ''].indexOf(normalizedEditorValue) >= 0) {\n        var paymentValue = normalizedEditorValue === 'true' ? 'true' : (normalizedEditorValue === 'false' ? 'false' : '');\n        content = '<select data-editor-index=\\"' + index + '\\" aria-label=\\"' + esc(label) + '\\"><option value=\\"\\" ' + (paymentValue === '' ? 'selected' : '') + '>Não informado</option><option value=\\"true\\" ' + (paymentValue === 'true' ? 'selected' : '') + '>Pago</option><option value=\\"false\\" ' + (paymentValue === 'false' ? 'selected' : '') + '>Não pago</option></select>';\n      } else if (kind === 'person' && [11, 13].indexOf(index) >= 0) {\n        content = '<textarea data-editor-index=\\"' + index + '\\" aria-label=\\"' + esc(label) + '\\">' + esc(value) + '</textarea>';\n      } else {\n        content = '<input type=\\"text\\" data-editor-index=\\"' + index + '\\" aria-label=\\"' + esc(label) + '\\" value=\\"' + esc(value) + '\\"' + (isNew && kind === 'person' && index === 0 ? ' required' : (isNew && kind === 'order' && index === 1 ? ' required' : '')) + '>';\n      }'''
          if old not in s:
              raise SystemExit('Bloco do editor não encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q "PAGAMENTO CAMISETA" index.html
          grep -q "Não informado" index.html
          git diff --check
      - name: Publicar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: melhorar editor de camisetas'
          git push
      - name: Remover workflow temporário
        if: success()
        run: |
          rm .github/workflows/fix-editor-camiseta.yml
          git add .github/workflows/fix-editor-camiseta.yml
          git commit -m 'chore: remover workflow temporário'
          git push
