name: Aplicar preenchimento rápido de camisetas

on:
  push:
    branches:
      - feature/etapa-shirt-quick-fill
permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Aplicar preenchimento rápido
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = '.data-item .item-actions [data-checkin]{min-height:40px}.data-item .item-badges .tag{white-space:normal}\n'
          css = '''\n.people-quick-fields{display:grid;grid-template-columns:repeat(3,minmax(130px,1fr));gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--ln)}\n.people-quick-field{display:grid;gap:4px;min-width:0}\n.people-quick-field label{font-size:10px;font-weight:750;letter-spacing:.055em;text-transform:uppercase;color:var(--mut)}\n.people-quick-field select{width:100%;min-height:42px;padding:8px 28px 8px 10px;border:1px solid color-mix(in srgb,var(--pri) 26%,var(--ln));border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:12px;font-weight:600}\n.people-quick-field select:focus{outline:3px solid color-mix(in srgb,var(--pri) 20%,transparent);outline-offset:1px;border-color:var(--pri)}\n.people-quick-status{grid-column:1/-1;min-height:14px;font-size:11px;color:var(--mut)}\n.people-quick-status.is-saving{color:var(--pri)}\n.people-quick-status.is-saved{color:var(--ok)}\n.people-quick-status.is-error{color:var(--er)}\n@media(max-width:700px){.people-quick-fields{grid-template-columns:1fr 1fr}.people-quick-field:last-of-type{grid-column:1/-1}}\n@media(max-width:430px){.people-quick-fields{grid-template-columns:1fr}.people-quick-field:last-of-type{grid-column:auto}}\n'''
          if '.people-quick-fields{' not in s:
              if css_anchor not in s: raise SystemExit('Âncora CSS não encontrada')
              s = s.replace(css_anchor, css_anchor + css, 1)

          marker = '  function drawPeopleResults() {\n'
          helpers = r'''  function quickBooleanValue(value) {
    var parsed = asBoolean(value);
    return parsed === true ? 'true' : (parsed === false ? 'false' : '');
  }
  function quickBooleanOptions(value, trueLabel, falseLabel) {
    var selected = quickBooleanValue(value);
    return '<option value=""' + (selected === '' ? ' selected' : '') + '>Não informado</option>' +
      '<option value="true"' + (selected === 'true' ? ' selected' : '') + '>' + esc(trueLabel) + '</option>' +
      '<option value="false"' + (selected === 'false' ? ' selected' : '') + '>' + esc(falseLabel) + '</option>';
  }
  function quickSizeOptions(value) {
    var current = clean(value);
    var sizes = ['', 'PP', 'P', 'M', 'G', 'GG', 'G1', 'G2', 'G3', 'XGG'];
    if (current && sizes.indexOf(current) < 0) sizes.push(current);
    return sizes.map(function (size) {
      return '<option value="' + esc(size) + '"' + (current === size ? ' selected' : '') + '>' + esc(size || 'Não informado') + '</option>';
    }).join('');
  }
  function quickPersonControls(person) {
    return '<div class="people-quick-fields" aria-label="Preenchimento rápido do cadastro">' +
      '<div class="people-quick-field"><label>Entrou no grupo?</label><select data-quick-row="' + esc(person.sourceRow) + '" data-quick-field="group" aria-label="Entrou no grupo? · ' + esc(displayName(person)) + '">' + quickBooleanOptions(person.group, 'Sim', 'Não') + '</select></div>' +
      '<div class="people-quick-field"><label>Tamanho da camiseta</label><select data-quick-row="' + esc(person.sourceRow) + '" data-quick-field="size" aria-label="Tamanho da camiseta · ' + esc(displayName(person)) + '">' + quickSizeOptions(shirtSizeValue(person)) + '</select></div>' +
      '<div class="people-quick-field"><label>Pagamento camiseta</label><select data-quick-row="' + esc(person.sourceRow) + '" data-quick-field="payment" aria-label="Pagamento camiseta · ' + esc(displayName(person)) + '">' + quickBooleanOptions(person.shirtPaid, 'Pago', 'Não pago') + '</select></div>' +
      '<div class="people-quick-status" aria-live="polite"></div>' +
    '</div>';
  }
  async function updatePersonQuickField(sourceRow, field, value, selectNode) {
    if (!appData) return;
    var draft = cloneWorkspaceForEdit();
    var personIndex = draft.people.findIndex(function (p) { return String(p.sourceRow) === String(sourceRow); });
    if (personIndex < 0) return;
    var person = draft.people[personIndex];
    var fields = (person.fields || []).slice();
    while (fields.length < 14) fields.push(null);
    var sheetName = Object.keys(draft.rawSheets || {}).find(function (name) { return normal(name) === 'batismo'; });
    var rowIndex = Number(sourceRow) - 1;
    var sourceRows = sheetName ? draft.rawSheets[sheetName] : null;
    if (!sourceRows || rowIndex < 1 || rowIndex >= sourceRows.length) return;
    var row = (sourceRows[rowIndex] || []).slice();
    var nextValue = (field === 'group' || field === 'payment') ? (value === '' ? null : value === 'true') : (value === '' ? null : value);
    var fieldIndex = field === 'group' ? 7 : (field === 'size' ? 8 : 9);
    fields[fieldIndex] = nextValue;
    row[fieldIndex] = nextValue;
    person.fields = fields;
    person.group = fields[7];
    person.shirt = fields[8];
    person.shirtPaid = fields[9];
    draft.people[personIndex] = person;
    sourceRows[rowIndex] = row;
    var container = selectNode && selectNode.closest('.data-item');
    var status = container && container.querySelector('.people-quick-status');
    if (status) { status.className = 'people-quick-status is-saving'; status.textContent = 'Salvando…'; }
    if (container) container.querySelectorAll('select[data-quick-field]').forEach(function (node) { node.disabled = true; });
    try {
      if (typeof window.firebaseSaveWorkspace !== 'function') throw new Error('A conexão com o Firebase não está disponível.');
      await window.firebaseSaveWorkspace(draft, true);
      try { await saveWorkspace(draft, false); } catch (localError) {}
      appData = draft;
      drawPeopleResults();
    } catch (error) {
      if (status) { status.className = 'people-quick-status is-error'; status.textContent = 'Não salvo'; }
      setImportMessage('Não foi possível salvar esta alteração rápida: ' + (error.message || 'erro desconhecido'), 'error');
      if (selectNode) selectNode.disabled = false;
    }
  }
'''
          if 'function quickPersonControls(person)' not in s:
              if marker not in s: raise SystemExit('Âncora drawPeopleResults não encontrada')
              s = s.replace(marker, helpers + marker, 1)

          old = "</div></div><div class=\"item-actions\">' + checkinActions + '<button type=\"button\" class=\"btn o\" data-open-person=\"' + esc(p.sourceRow)"
          new = "</div>' + quickPersonControls(p) + '</div><div class=\"item-actions\">' + checkinActions + '<button type=\"button\" class=\"btn o\" data-open-person=\"' + esc(p.sourceRow)"
          if 'quickPersonControls(p)' not in s:
              if old not in s: raise SystemExit('Linha de participante não encontrada')
              s = s.replace(old, new, 1)

          listener = "    document.getElementById('people-filter').addEventListener('change', function () { peopleState.filter = this.value; peopleState.page = 1; drawPeopleResults(); });\n"
          listener_add = listener + "    document.getElementById('people-results').addEventListener('change', function (event) {\n      var node = event.target;\n      if (!node || !node.matches('select[data-quick-field]')) return;\n      updatePersonQuickField(node.getAttribute('data-quick-row'), node.getAttribute('data-quick-field'), node.value, node);\n    });\n"
          if 'select[data-quick-field]' not in s:
              if listener not in s: raise SystemExit('Listener base não encontrado')
              s = s.replace(listener, listener_add, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S | re.I)
          Path('/tmp/scripts.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('scripts inline:', len(scripts))
          PY
          node --check /tmp/scripts.js
      - name: Commitar alteração e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-shirt-quick-fill.yml
          git rm .github/workflows/apply-shirt-quick-fill.yml
          git add index.html
          git commit -m "feat: adicionar preenchimento rápido de grupo e camiseta"
          git push
